<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Camunda BPMN to mCRL2 Verification Pipeline</text>
  <text x="40" y="74" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Local conversion keeps the group method: BPMN control/message flow is first mapped to a Petri net, then translated to mCRL2 for LTS and modal-formula checks.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="126" width="170" height="82" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="133" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Camunda BPMN</text>
    <text x="133" y="182" font-size="12" text-anchor="middle" fill="#334155">9 processes / 25 messages</text>

    <line x1="218" y1="167" x2="286" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="252" y="150" font-size="12" text-anchor="middle" fill="#475569">bpmn2pnml_local.py</text>

    <rect x="296" y="126" width="170" height="82" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="381" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">PNML</text>
    <text x="381" y="182" font-size="12" text-anchor="middle" fill="#334155">Petri-net places/transitions</text>

    <line x1="466" y1="167" x2="534" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="150" font-size="12" text-anchor="middle" fill="#475569">pnml2mcrl2.py</text>

    <rect x="544" y="126" width="170" height="82" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="629" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">mCRL2</text>
    <text x="629" y="182" font-size="12" text-anchor="middle" fill="#334155">bounded process model</text>

    <line x1="714" y1="167" x2="782" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="748" y="150" font-size="12" text-anchor="middle" fill="#475569">mcrl22lps / lps2lts</text>

    <rect x="792" y="126" width="170" height="82" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="877" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">LTS + PBES</text>
    <text x="877" y="182" font-size="12" text-anchor="middle" fill="#334155">lts2pbes + pbes2bool</text>

    <line x1="877" y1="208" x2="877" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="752" y="254" width="250" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="877" y="282" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Reports: JSON, Markdown, SVG</text>
  </g>
</svg>
